<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: rgb(232, 230, 230);
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        /* Sidebar with thumbnails */
        .image-gallery {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .image-gallery img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            cursor: pointer;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s ease;
        }

        .image-gallery img:hover {
            border-color: rgb(0, 123, 255);
        }

        /* Main flower image display */
        .flower-image-main {
            text-align: center;
            padding: 0 30px;
        }

        .flower-image-main img {
            width: 100%;
            height: auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Details section */
        .flower-details {
            padding: 0 20px;
        }

        .flower-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .flower-price {
            font-size: 24px;
            color: rgb(0, 123, 255);
            margin-top: 10px;
        }

        .flower-reviews {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        .btn-container {
            margin-top: 20px;
        }

        .add-to-cart-btn, .buy-now-btn {
            width: 48%;
            background-color: rgb(0, 123, 255);
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .add-to-cart-btn:hover, .buy-now-btn:hover {
            background-color: rgb(40, 167, 255);
        }

        /* Extra items below details */
        .extra-items {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .extra-item {
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 22%;
        }

        .extra-item img {
            width: 100%;
            border-radius: 5px;
        }

        .extra-item-price {
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .extra-item-title {
            font-size: 14px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .flower-image-main {
                padding: 0;
            }

            .extra-items {
                flex-wrap: wrap;
                justify-content: center;
            }

            .extra-item {
                width: 48%;
                margin-bottom: 10px;
            }

            .add-to-cart-btn, .buy-now-btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <div class="row">
            <!-- Image Gallery on the Left -->
            <div class="col-md-2 image-gallery">
                <img src="img1.jpg" alt="Flower Image 1">
                <img src="img2.jpg" alt="Flower Image 2">
                <img src="img3.jpg" alt="Flower Image 3">
                <img src="img4.jpg" alt="Flower Image 4">
            </div>

            <!-- Main Flower Image in the Center -->
            <div class="col-md-5 flower-image-main">
                <img src="{{data.flower_image.url}}" alt="Main Flower Image">
            </div>

            <!-- Flower Details and Buttons on the Right -->
            <div class="col-md-5 flower-details">
                <h1 class="flower-name">10 Red Roses Bouquet</h1>
                <p class="flower-reviews"><i class="fas fa-star text-success"></i> 4.9 &middot; 1562 Reviews &middot; <i class="fas fa-clock"></i> 30-60 Min Delivery</p>
                <p class="flower-price">₹ {{data.flower_price}}</p>

                <!-- Extra options (like with chocolates, with teddy, etc.) -->
                <div class="extra-items">
                    <div class="extra-item">
                        <img src="img1.jpg" alt="Extra 1">
                        <p class="extra-item-title">Basic</p>
                        <p class="extra-item-price">₹ 545</p>
                    </div>
                    <div class="extra-item">
                        <img src="img2.jpg" alt="Extra 2">
                        <p class="extra-item-title">With Chocolate</p>
                        <p class="extra-item-price">₹ 895</p>
                    </div>
                    <div class="extra-item">
                        <img src="img3.jpg" alt="Extra 3">
                        <p class="extra-item-title">With Teddy</p>
                        <p class="extra-item-price">₹ 995</p>
                    </div>
                    <div class="extra-item">
                        <img src="img4.jpg" alt="Extra 4">
                        <p class="extra-item-title">With Cake</p>
                        <p class="extra-item-price">₹ 1245</p>
                    </div>
                </div>

                <!-- Add to Cart and Buy Now Buttons -->
                <div class="btn-container">
                    <a href="/addcart/{{ data.flower_id }}" class="add-to-cart-btn">Add to Cart</a>
                    <a href="/buynow/flower_id" class="buy-now-btn">Buy Now | ₹ {{data.flower_price}}</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
